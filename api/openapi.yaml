        - PROCESS_START_FAILED
        - PROCESS_STOP_FAILED
        - REQUEST_VALIDATION_FAILED
        - RESOURCE_NOT_FOUND
        - RUNNER_NOT_FOUND
        - RUNNER_PATH_UNSAFE
        - RUNNER_VERSION_CHECK_FAILED
        - RUNNER_VERSION_CHECK_TIMEOUT
        - REVISION_NOT_FOUND
        - REVISION_GIT_PROBE_FAILED
        - REVISION_SOURCE_UNAVAILABLE
        - REVISION_SOURCE_UNSAFE
        - REVISION_SOURCE_TOO_LARGE
        - SECRET_INVALID
