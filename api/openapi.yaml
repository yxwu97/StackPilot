openapi: 3.1.0
info:
  title: StackPilot API
  version: 0.0.0
  description: StackPilot local control-plane API contract.
servers:
  - url: /
security:
  - bearerAuth: []
  - sessionAuth: []
paths:
  /health/live:
    get:
      security: []
      operationId: getLiveHealth
      summary: Check whether the control-plane process is alive
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: live
  /health/ready:
    get:
      security: []
      operationId: getReadyHealth
      summary: Check whether persistence and reconciliation are ready
      responses:
        "200":
          description: The control plane is ready to serve stateful requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ready
        "503":
          $ref: "#/components/responses/HealthNotReady"
  /version:
    get:
      security: []
      operationId: getVersion
      summary: Read build identity and enabled capabilities
      responses:
        "200":
          description: Build and API identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
              example:
                version: 0.1.0
                commit: unknown
                buildTime: unknown
                apiVersion: v1
                capabilities: []
  /api/v1/auth/bootstrap:
    post:
      operationId: issueBrowserBootstrap
      summary: Issue a short-lived single-use browser bootstrap code
      security:
        - bearerAuth: []
      responses:
        "201":
          description: One-time bootstrap code issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/session:
    post:
      operationId: exchangeBrowserSession
      summary: Exchange a same-origin fragment bootstrap for a browser session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionExchangeRequest"
      responses:
        "201":
          description: Browser session created and set as an HttpOnly cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      operationId: renewBrowserSession
      summary: Renew an active browser session and rotate its CSRF value
      description: Advances the 30-minute renewal expiry without exceeding the eight-hour absolute limit, rotates CSRF, and refreshes the HttpOnly cookie. This state-changing recovery GET is same-origin credentialed and is never cacheable.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Session was renewed and its CSRF value and cookie were rotated.
          headers:
            Set-Cookie:
              description: Refreshed HttpOnly session cookie with the authoritative renewal expiry.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: revokeBrowserSession
      summary: Revoke the current browser session
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204":
          description: Browser session revoked and cookie expired.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/token/rotate:
    post:
      operationId: rotateLocalAuthenticationToken
      summary: Rotate the OS-protected local token and invalidate browser sessions
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200":
          description: Local token rotated; browser callers receive an expired session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRotationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/audit-events:
    get:
      operationId: listAuditEvents
      summary: List safe immutable audit records after a stable cursor
      parameters:
        - name: afterId
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Ascending audit event page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/secrets/{systemId}/{secretName}:
    parameters:
      - $ref: "#/components/parameters/SystemId"
      - $ref: "#/components/parameters/SecretName"
    get:
      operationId: getSecretMetadata
      summary: Read non-sensitive metadata for one protected Secret
      responses:
        "200":
          description: Secret metadata without its value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretMetadata"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: setSecret
      summary: Atomically set a protected Secret from a transient request buffer
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretSetRequest"
      responses:
        "200":
          description: New non-sensitive Secret metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretMetadata"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteSecret
      summary: Delete a protected Secret and its metadata projection
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200":
          description: Metadata of the deleted Secret; the value is never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretMetadata"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workspaces:
    get:
      operationId: listWorkspaces
      summary: List registered workspaces
      responses:
        "200":
          description: Registered workspaces in stable order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceList"
    post:
      operationId: registerWorkspace
      summary: Register the fixed manifest in a workspace root
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterWorkspaceRequest"
      responses:
        "201":
          description: Workspace registered with its first valid snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableManifest"
  /api/v1/workspaces/{workspaceId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getWorkspaceDetail
      summary: Get one consistent workspace management snapshot
      responses:
        "200":
          description: Workspace registration, source, manifest, services, ports, and runtime summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unregisterWorkspace
      summary: Remove StackPilot catalog data without changing workspace files
      description: Requires the workspace to have no active runtime instance or Operation.
      responses:
        "204":
          description: Workspace unregistered.
        "409":
          $ref: "#/components/responses/Conflict"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workspaces/probe:
    post:
      operationId: probeWorkspace
      summary: Probe a workspace root and choose registration or initialization
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceProbeRequest"
      responses:
        "200":
          description: A normal probe state and bounded BAT candidates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceProbe"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableManifest"
  /api/v1/workspace-imports/analyze:
    post:
      operationId: analyzeWorkspaceImport
      summary: Persist a bounded read-only BAT analysis draft
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceAnalyzeRequest"
      responses:
        "201":
          description: Persisted structured import draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceImportDraft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableManifest"
  /api/v1/workspace-imports/drafts/{draftId}:
    parameters:
      - name: draftId
        in: path
        required: true
        schema:
          type: string
          pattern: "^draft_[0-9a-f]{32}$"
    get:
      operationId: getWorkspaceImportDraft
      summary: Get a persisted workspace import draft
      responses:
        "200":
          description: Import draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceImportDraft"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workspace-imports/drafts/{draftId}/apply:
    parameters:
      - name: draftId
        in: path
        required: true
        schema:
          type: string
          pattern: "^draft_[0-9a-f]{32}$"
      - $ref: "#/components/parameters/CSRF"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: applyWorkspaceImportDraft
      summary: Queue a durable manifest publication and registration Operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceApplyRequest"
      responses:
        "202":
          description: Import Operation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationRef"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableManifest"
  /api/v1/workspace-imports/drafts/{draftId}/corrections:
    parameters:
      - name: draftId
        in: path
        required: true
        schema:
          type: string
          pattern: "^draft_[0-9a-f]{32}$"
      - $ref: "#/components/parameters/CSRF"
    post:
      operationId: correctWorkspaceImportDraft
      summary: Create a validated draft from structured field corrections
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceImportCorrectionRequest"
      responses:
        "201":
          description: Corrected persisted draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceImportDraft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableManifest"
  /api/v1/workspace-imports/operations/{operationId}:
    parameters:
      - $ref: "#/components/parameters/OperationId"
    get:
      operationId: getWorkspaceImportOperation
      summary: Get a pre-registration workspace Operation
      responses:
        "200":
          description: Workspace import Operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceImportOperation"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workspaces/{workspaceId}/refresh:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: refreshWorkspaceManifest
      summary: Re-read and validate the fixed workspace manifest
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200":
          description: Workspace refreshed from the fixed manifest path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableManifest"
  /api/v1/workspaces/{workspaceId}/edit-drafts:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/CSRF"
    post:
      operationId: createWorkspaceEditDraft
      summary: Create a structured edit preview against the current manifest digest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceEditDraftRequest"
      responses:
        "201":
          description: Persisted edit draft with validated manifest preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceImportDraft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/workspaces/{workspaceId}/relink-drafts:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/CSRF"
    post:
      operationId: createWorkspaceRelinkDraft
      summary: Validate a new root for the same registered system identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceRelinkDraftRequest"
      responses:
        "201":
          description: Persisted relink draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceImportDraft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/systems:
    get:
      operationId: listSystems
      summary: List registered system definitions
      responses:
        "200":
          description: Registered system summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemList"
  /api/v1/systems/{systemId}:
    parameters:
      - $ref: "#/components/parameters/SystemId"
      - $ref: "#/components/parameters/WorkspaceIdQuery"
    get:
      operationId: getSystem
      summary: Read one system and its last valid definition summary
      responses:
        "200":
          description: System definition summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/services/{systemId}/{serviceId}:
    parameters:
      - $ref: "#/components/parameters/SystemId"
      - $ref: "#/components/parameters/ServiceId"
      - $ref: "#/components/parameters/WorkspaceIdQuery"
    get:
      operationId: getService
      summary: Read a safe service definition summary
      responses:
        "200":
          description: Service definition summary without commands or environment values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceDefinition"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/systems/{systemId}/start:
    parameters:
      - $ref: "#/components/parameters/SystemId"
    post:
      operationId: startSystem
      summary: Queue the Phase 1B root-service start operation
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSystemRequest"
      responses:
        "202":
          description: The operation was queued or replayed idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationRef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableManifest"
  /api/v1/systems/{systemId}/stop:
    parameters:
      - $ref: "#/components/parameters/SystemId"
    post:
      operationId: stopSystem
      summary: Queue a non-cancellable Phase 1B root-service stop operation
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopSystemRequest"
      responses:
        "202":
          description: The stop operation was queued or replayed idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationRef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/systems/{systemId}/restart:
    parameters:
      - $ref: "#/components/parameters/SystemId"
    post:
      operationId: restartSystem
      summary: Stop the active runtime and fresh-start the latest valid manifest
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSystemRequest"
      responses:
        "202":
          description: The restart operation was queued or replayed idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationRef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableManifest"
  /api/v1/services/{systemId}/{serviceId}/restart:
    parameters:
      - $ref: "#/components/parameters/SystemId"
      - $ref: "#/components/parameters/ServiceId"
    post:
      operationId: restartService
      summary: Restart one service and its transitive downstream closure
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopSystemRequest"
      responses:
        "202":
          description: The service restart operation was queued or replayed idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationRef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/systems/{systemId}/status:
    parameters:
      - $ref: "#/components/parameters/SystemId"
      - $ref: "#/components/parameters/WorkspaceIdQuery"
    get:
      operationId: getSystemRuntimeStatus
      summary: Read the server-computed active runtime state
      responses:
        "200":
          description: Current runtime status, or stopped when no active instance exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemRuntimeStatus"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/workspaces/{workspaceId}/metrics:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getWorkspaceMetrics
      summary: Read a bounded resource metric window for managed services
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: granularity
          in: query
          required: true
          schema:
            type: string
            enum: [detail, hour]
        - name: serviceId
          in: query
          schema:
            type: array
            maxItems: 100
            items:
              $ref: "#/components/schemas/ManifestId"
      responses:
        "200":
          description: At most 2,000 points over no more than 31 days.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricSeriesList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/FeatureNotEnabled"
  /api/v1/workspaces/{workspaceId}/revisions:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listWorkspaceRevisions
      summary: List safe immutable revision summaries for a workspace
      responses:
        "200":
          description: Newest revision summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionList"
        "422":
          $ref: "#/components/responses/FeatureNotEnabled"
  /api/v1/revisions/{revisionId}:
    parameters:
      - name: revisionId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RevisionId"
    get:
      operationId: getSystemRevision
      summary: Read one safe immutable revision summary
      responses:
        "200":
          description: Revision summary without paths, commands, environment, or source contents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionSummary"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/FeatureNotEnabled"
  /api/v1/workspaces/{workspaceId}/change-plans:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: createChangePlan
      summary: Start a read-only running-to-workspace comparison
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Read-only planning Operation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationRef"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/FeatureNotEnabled"
  /api/v1/change-plans/{changePlanId}:
    parameters:
      - name: changePlanId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ChangePlanId"
    get:
      operationId: getChangePlan
      summary: Read one immutable deterministic change plan
      responses:
        "200":
          description: Safe structured change plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePlan"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/FeatureNotEnabled"
  /api/v1/workspaces/{workspaceId}/verified-restart:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: createVerifiedRestart
      summary: Restart against an unchanged non-blocked plan and verify stability
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifiedRestartRequest"
      responses:
        "202":
          description: Verified restart Operation accepted after pre-side-effect validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationRef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/FeatureNotEnabled"
  /api/v1/operations/{operationId}:
    parameters:
      - name: operationId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/OperationId"
    get:
      operationId: getOperation
      summary: Read an operation and its ordered structured steps
      responses:
        "200":
          description: Persisted operation snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/operations:
    get:
      operationId: listOperations
      summary: List the newest persisted operations and structured steps
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdQuery"
      responses:
        "200":
          description: At most 50 operations in newest-first order.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 50
                    items:
                      $ref: "#/components/schemas/Operation"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/operations/{operationId}/cancel:
    parameters:
      - name: operationId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/OperationId"
    post:
      operationId: cancelOperation
      summary: Record cooperative cancellation for a cancellable operation
      responses:
        "202":
          description: Cancellation was recorded; terminal compensation may still be running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationRef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/events:
    get:
      operationId: streamEvents
      summary: Stream persisted domain events with resumable IDs
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: integer
            minimum: 0
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: A server-sent event stream. Last-Event-ID takes precedence over cursor.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/services/{systemId}/{serviceId}/logs:
    parameters:
      - $ref: "#/components/parameters/SystemId"
      - $ref: "#/components/parameters/ServiceId"
    get:
      operationId: getServiceLogs
      summary: Read a bounded newest-first historical log window
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdQuery"
        - name: instanceId
          in: query
          required: true
          schema:
            type: string
            pattern: "^si_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
        - name: cursor
          in: query
          required: false
          description: Return the latest entries with sequence values lower than this cursor.
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 500
        - name: level
          in: query
          required: false
          schema:
            type: string
            enum: [trace, debug, info, warn, error, fatal]
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Ascending log entries from the selected newest window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/log-stream:
    get:
      operationId: streamServiceLogs
      summary: Stream redacted service logs after a sequence cursor
      parameters:
        - name: instanceId
          in: query
          required: true
          schema:
            type: string
            pattern: "^si_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
        - name: serviceId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ManifestId"
        - name: afterSequence
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A server-sent log stream whose SSE IDs are service-instance sequence values.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/incidents:
    get:
      operationId: listIncidents
      summary: List bounded diagnostic incidents for one workspace
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/WorkspaceId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Newest-first incident summaries with redacted bounded context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentList"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/incidents/{incidentId}:
    get:
      operationId: getIncident
      summary: Read one incident and all versioned deterministic analyses
      parameters:
        - name: incidentId
          in: path
          required: true
          schema:
            type: string
            pattern: "^inc_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
      responses:
        "200":
          description: Traceable incident evidence and diagnoses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/incidents/{incidentId}/analyze:
    post:
      operationId: analyzeIncident
      summary: Queue a read-only evidence refresh and deterministic rule analysis
      parameters:
        - name: incidentId
          in: path
          required: true
          schema:
            type: string
            pattern: "^inc_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "202":
          description: The read-only analyze Operation was queued or replayed idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationRef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Long-lived local token read only from OS-protected storage by CLI clients.
    sessionAuth:
      type: apiKey
      in: cookie
      name: stackpilot_session
  parameters:
    CSRF:
      name: X-StackPilot-CSRF
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/WorkspaceId"
    WorkspaceIdQuery:
      name: workspaceId
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/WorkspaceId"
    SystemId:
      name: systemId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ManifestId"
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ManifestId"
    SecretName:
      name: secretName
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ManifestId"
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OperationId"
    IdempotencyKey:
      name: Idempotency-Key
