        - WORKSPACE_SYSTEM_ID_CHANGED
    TokenRotationResponse:
      type: object
      additionalProperties: false
      required: [createdAt]
      properties:
        createdAt:
          type: string
          format: date-time
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, subjectType, action, targetType, result, traceId, clientType, occurredAt]
      properties:
        id:
          type: integer
          minimum: 1
        subjectType:
          type: string
          enum: [local_token, browser_session, system]
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
        result:
          type: string
          enum: [accepted, succeeded, failed, denied]
        traceId:
          type: string
        operationId:
          type: string
        clientType:
          type: string
          enum: [cli, web, internal]
        errorCode:
          $ref: "#/components/schemas/ErrorCode"
        occurredAt:
          type: string
          format: date-time
    AuditEventPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/AuditEvent"
        nextCursor:
          type: [integer, "null"]
          minimum: 1
    BootstrapResponse:
      type: object
      additionalProperties: false
      required: [code, expiresAt]
      properties:
        code:
          type: string
          minLength: 43
          maxLength: 43
        expiresAt:
          type: string
          format: date-time
    SessionExchangeRequest:
      type: object
      additionalProperties: false
      required: [bootstrap]
      properties:
        bootstrap:
          type: string
          minLength: 43
          maxLength: 43
    SessionResponse:
      type: object
      additionalProperties: false
      required: [csrf, expiresAt]
      properties:
        csrf:
          type: string
          minLength: 43
          maxLength: 43
        expiresAt:
          type: string
          format: date-time
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - details
        - traceId
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        operationId:
          type:
            - string
            - "null"
          pattern: "^op_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
        traceId:
          type: string
          pattern: "^tr_[0-9a-f]{32}$"
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/Error"
    OperationId:
      type: string
      pattern: "^op_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    StartSystemRequest:
      type: object
      additionalProperties: false
      properties:
        workspaceId:
          $ref: "#/components/schemas/WorkspaceId"
        portOverrides:
          type: object
          additionalProperties:
            type: integer
            minimum: 1024
            maximum: 65535
        failurePolicy:
          type: object
          additionalProperties: false
          properties:
            failFast:
              type: boolean
            cleanupOnFailure:
              type: boolean
            keepReadyServices:
              type: boolean
    StopSystemRequest:
      type: object
      additionalProperties: false
      properties:
        workspaceId:
          $ref: "#/components/schemas/WorkspaceId"
    OperationRef:
      type: object
      additionalProperties: false
      required: [operationId, state]
      properties:
        operationId:
          $ref: "#/components/schemas/OperationId"
        state:
          type: string
          enum: [queued, running, cancelling, succeeded, failed, cancelled]
    OperationStep:
      type: object
      additionalProperties: false
      required: [number, key, state, attempt]
      properties:
        number:
          type: integer
          minimum: 1
        key:
          type: string
        state:
          type: string
          enum: [pending, running, succeeded, failed, skipped, cancelled]
        attempt:
          type: integer
          minimum: 0
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          minimum: 0
        errorCode:
          type: string
        detailRef:
          type: string
    Operation:
      type: object
      additionalProperties: false
      required: [id, workspaceId, systemId, type, state, cancellable, createdAt, steps]
      properties:
        id:
          $ref: "#/components/schemas/OperationId"
        workspaceId:
          $ref: "#/components/schemas/WorkspaceId"
        systemId:
          $ref: "#/components/schemas/ManifestId"
        type:
          type: string
          enum: [start, stop, restart, service-restart, port-plan, refresh, analyze, change-plan, verified-restart]
        state:
          type: string
          enum: [queued, running, cancelling, succeeded, failed, cancelled]
        cancellable:
          type: boolean
        cancelRequestedAt:
          type: string
          format: date-time
        errorCode:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          minimum: 0
        steps:
          type: array
          maxItems: 128
          items:
            $ref: "#/components/schemas/OperationStep"
    RevisionId:
      type: string
      pattern: "^rev_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    ChangePlanId:
      type: string
      pattern: "^plan_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    MetricPoint:
      type: object
      additionalProperties: false
      required: [observedAt, status]
      properties:
        observedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [available, unavailable, unsupported]
        cpuPercent:
          type: number
          minimum: 0
          maximum: 100
        memoryBytes:
          type: integer
          minimum: 0
        processCount:
          type: integer
          minimum: 0
        containerCount:
          type: integer
          minimum: 0
        reasonCode:
          type: string
          maxLength: 128
    MetricSeries:
      type: object
      additionalProperties: false
      required: [serviceId, source, points]
      properties:
        serviceId:
          $ref: "#/components/schemas/ManifestId"
        source:
          type: string
          enum: [process-job, compose]
        points:
          type: array
          maxItems: 2000
          items:
            $ref: "#/components/schemas/MetricPoint"
    MetricSeriesList:
      type: object
      additionalProperties: false
      required: [from, to, granularity, series]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        granularity:
          type: string
          enum: [detail, hour]
        series:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/MetricSeries"
    RevisionSummary:
      type: object
      additionalProperties: false
      required: [id, workspaceId, systemId, kind, schemaVersion, digest, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/RevisionId"
        workspaceId:
          $ref: "#/components/schemas/WorkspaceId"
        systemId:
          $ref: "#/components/schemas/ManifestId"
        systemInstanceId:
          type: string
          pattern: "^si_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
        kind:
          type: string
          enum: [running, workspace]
        schemaVersion:
          type: string
          maxLength: 32
        digest:
          $ref: "#/components/schemas/Digest"
        createdAt:
          type: string
          format: date-time
    RevisionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/RevisionSummary"
    ChangePlanItem:
      type: object
      additionalProperties: false
      required: [kind, change, risk, key, summary]
      properties:
        kind:
          type: string
          enum: [manifest, service, dependency, runner, port, health, restart, dependency-file, compose, secret]
        change:
          type: string
          enum: [added, removed, changed]
        risk:
          type: string
          enum: [info, low, medium, high, blocked]
        key:
          type: string
          maxLength: 256
        summary:
          type: string
          maxLength: 1024
    ChangePlan:
      type: object
      additionalProperties: false
      required: [id, workspaceId, systemId, createdByOperationId, fromRevision, toRevision, ruleVersion, state, risk, itemCount, blockedCount, items, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/ChangePlanId"
        workspaceId:
          $ref: "#/components/schemas/WorkspaceId"
        systemId:
          $ref: "#/components/schemas/ManifestId"
        createdByOperationId:
          $ref: "#/components/schemas/OperationId"
        fromRevision:
          $ref: "#/components/schemas/RevisionSummary"
        toRevision:
          $ref: "#/components/schemas/RevisionSummary"
        ruleVersion:
          type: string
          maxLength: 32
        state:
          type: string
          enum: [ready, blocked]
        risk:
          type: string
          enum: [info, low, medium, high, blocked]
        itemCount:
          type: integer
          minimum: 0
          maximum: 10000
        blockedCount:
          type: integer
          minimum: 0
          maximum: 10000
        items:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/ChangePlanItem"
        createdAt:
          type: string
          format: date-time
    VerifiedRestartRequest:
      type: object
      additionalProperties: false
      required: [changePlanId]
      properties:
        changePlanId:
          $ref: "#/components/schemas/ChangePlanId"
    ServiceRuntimeStatus:
      type: object
      additionalProperties: false
      required: [serviceId, serviceInstanceId, driver, mode, state, stateVersion, dependsOn, containers]
      properties:
        serviceId:
          $ref: "#/components/schemas/ManifestId"
        serviceInstanceId:
          type: string
          pattern: "^svi_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
        driver:
          type: string
          enum: [process, compose]
        mode:
          type: string
          enum: [daemon, oneshot]
        state:
          type: string
          enum: [stopped, waiting_dependency, starting, waiting_ready, ready, degraded, completed, stopping, failed, unknown]
        stateVersion:
          type: integer
          minimum: 1
        pid:
          type: integer
          minimum: 1
        processStartedAt:
          type: string
          format: date-time
        commandDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        exitCode:
          type: integer
          minimum: 0
        dependsOn:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ManifestId"
        containers:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/ComposeContainerRuntimeStatus"
    ComposeContainerRuntimeStatus:
      type: object
      additionalProperties: false
      required: [service, state, health, exitCode]
      properties:
        service:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
        state:
          type: string
          enum: [running, stopped, exited, restarting, paused, dead, created]
        health:
          type: string
          enum: [healthy, unhealthy, starting, ""]
        exitCode:
          type: integer
    PortRuntimeStatus:
      type: object
      additionalProperties: false
      required: [logicalName, port, source, replaced]
      properties:
        logicalName:
          $ref: "#/components/schemas/ManifestId"
        port:
          type: integer
          minimum: 1024
          maximum: 65535
        source:
          type: string
          enum: [request, workspace, sticky, preferred, fallback]
        replaced:
          type: boolean
        conflictPort:
          type: integer
          minimum: 1024
          maximum: 65535
    SystemRuntimeStatus:
      type: object
      additionalProperties: false
      required: [systemId, workspaceId, state, services, ports, healthCoverage]
      properties:
        systemId:
          $ref: "#/components/schemas/ManifestId"
        workspaceId:
          $ref: "#/components/schemas/WorkspaceId"
        state:
          type: string
          enum: [stopping, failed, starting, degraded, running, stopped]
        instanceId:
          type: string
          pattern: "^si_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
        manifestDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        resolvedSpecDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        startedAt:
          type: string
          format: date-time
        stoppedAt:
          type: string
          format: date-time
        services:
          type: array
          items:
            $ref: "#/components/schemas/ServiceRuntimeStatus"
        ports:
          type: array
          items:
            $ref: "#/components/schemas/PortRuntimeStatus"
        healthCoverage:
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/HealthCoverageSummary"
    HealthCoverageSummary:
      type: object
      additionalProperties: false
      required: [serviceInstanceId, coverage, satisfiesVerification]
      properties:
        serviceInstanceId:
          type: string
          pattern: "^svi_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
        readinessKind:
          type: string
          enum: [process, tcp, http, compose]
        livenessKind:
          type: string
          enum: [process, tcp, http, compose]
        coverage:
          type: string
          enum: [business, container, process-only, unavailable]
        satisfiesVerification:
          type: boolean
        latestSuccess:
          type: boolean
        latestErrorCode:
          type: string
          maxLength: 128
        latestCheckedAt:
          type: string
          format: date-time
    DomainEvent:
      type: object
      additionalProperties: false
      required: [id, type, occurredAt, workspaceId, systemId, data]
      properties:
        id:
          type: integer
          minimum: 1
        type:
          type: string
          pattern: "^[a-z][a-z0-9]*(?:\\.[a-z][a-z0-9]*)+$"
        occurredAt:
          type: string
          format: date-time
        workspaceId:
          $ref: "#/components/schemas/WorkspaceId"
        systemId:
          $ref: "#/components/schemas/ManifestId"
        instanceId:
          type: string
          pattern: "^si_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
        serviceInstanceId:
          type: string
          pattern: "^svi_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
        operationId:
          type: string
          pattern: "^op_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
        data:
          type: object
          additionalProperties: true
    LogEntry:
      type: object
      additionalProperties: false
      required: [timestamp, systemId, instanceId, serviceId, stream, level, message, sequence, truncated]
      properties:
        timestamp:
          type: string
          format: date-time
        systemId:
          $ref: "#/components/schemas/ManifestId"
        instanceId:
          type: string
          pattern: "^si_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
        serviceId:
          $ref: "#/components/schemas/ManifestId"
        stream:
          type: string
          enum: [stdout, stderr]
        level:
          type: string
        message:
          type: string
        operationId:
          type: string
          pattern: "^op_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
        sequence:
          type: integer
          minimum: 1
        truncated:
          type: boolean
    LogPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 5000
          items:
            $ref: "#/components/schemas/LogEntry"
        nextCursor:
          type: [integer, "null"]
          minimum: 1
    IncidentEvidence:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [event, health, log]
        eventId:
          type: integer
          minimum: 1
        healthResultId:
          type: integer
          minimum: 1
        serviceInstanceId:
          type: string
          pattern: "^svi_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
        logSequence:
          type: integer
          minimum: 1
    IncidentContext:
      type: object
      additionalProperties: false
      required: [schemaVersion, workspaceId, kind, triggerCode, windowStart, windowEnd, dependencies, ports, evidence, logs]
      properties:
        schemaVersion:
          type: string
        workspaceId:
          $ref: "#/components/schemas/WorkspaceId"
        systemInstanceId:
          type: string
        serviceInstanceId:
          type: string
        serviceId:
          $ref: "#/components/schemas/ManifestId"
        operationId:
          $ref: "#/components/schemas/OperationId"
        changePlanId:
          $ref: "#/components/schemas/ChangePlanId"
        revisionId:
          $ref: "#/components/schemas/RevisionId"
        kind:
          type: string
          enum: [port-conflict, process-exit, readiness-timeout, liveness-failure, restart-limit, identity-mismatch, known-log-error, verification-failure]
        triggerCode:
          type: string
        windowStart:
          type: string
          format: date-time
        windowEnd:
          type: string
          format: date-time
        dependencies:
          type: object
          additionalProperties:
            type: string
        ports:
          type: object
          additionalProperties:
            type: integer
        evidence:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/IncidentEvidence"
        logs:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: true
    Incident:
      type: object
      additionalProperties: false
      required: [id, workspaceId, kind, severity, state, occurrenceCount, context, firstSeenAt, lastSeenAt]
      properties:
        id:
          type: string
          pattern: "^inc_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
        workspaceId:
          $ref: "#/components/schemas/WorkspaceId"
        systemInstanceId:
          type: string
        serviceInstanceId:
          type: string
        serviceId:
          $ref: "#/components/schemas/ManifestId"
        kind:
          type: string
        severity:
          type: string
          enum: [info, warning, critical]
        state:
          type: string
          enum: [open, resolved]
        occurrenceCount:
          type: integer
          minimum: 1
        context:
          $ref: "#/components/schemas/IncidentContext"
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
    IncidentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Incident"
    IncidentAnalysis:
      type: object
      additionalProperties: false
      required: [id, engine, schemaVersion, result, createdAt]
      properties:
        id:
          type: integer
        engine:
          type: string
        schemaVersion:
          type: string
        result:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    IncidentDetail:
      type: object
      additionalProperties: false
      required: [incident, analyses]
      properties:
        incident:
          $ref: "#/components/schemas/Incident"
        analyses:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/IncidentAnalysis"
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - live
            - ready
    VersionResponse:
      type: object
      additionalProperties: false
      required:
        - version
        - commit
        - buildTime
        - apiVersion
        - capabilities
      properties:
        version:
          type: string
          description: Product version compiled into the running StackPilot executable.
          pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"
          example: 0.1.0
        commit:
          type: string
        buildTime:
          type: string
        apiVersion:
          type: string
          const: v1
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
    ManifestId:
      type: string
      pattern: "^[a-z][a-z0-9-]{0,62}$"
    SecretSetRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: string
          contentEncoding: base64
          minLength: 4
          maxLength: 87384
    SecretMetadata:
      type: object
      additionalProperties: false
      required: [id, systemId, name, provider, version, updatedAt]
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,62}/[a-z][a-z0-9-]{0,62}$"
        systemId:
          $ref: "#/components/schemas/ManifestId"
        name:
          $ref: "#/components/schemas/ManifestId"
        provider:
          type: string
          const: dpapi-file
        version:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
    WorkspaceId:
      type: string
      pattern: "^ws_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    Digest:
      type: string
      pattern: "^[0-9a-f]{64}$"
    RegisterWorkspaceRequest:
      type: object
      additionalProperties: false
      required:
        - path
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 32767
    Workspace:
      type: object
      additionalProperties: false
      required:
        - id
        - systemId
        - systemName
        - path
        - manifestStatus
        - manifestDigest
        - serviceCount
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: "#/components/schemas/WorkspaceId"
        systemId:
          $ref: "#/components/schemas/ManifestId"
        systemName:
          type: string
        path:
          type: string
        manifestStatus:
          type: string
          enum: [valid, invalid]
        manifestDigest:
          $ref: "#/components/schemas/Digest"
        lastErrorCode:
          $ref: "#/components/schemas/ErrorCode"
        serviceCount:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkspaceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
    WorkspaceProbeRequest:
      $ref: "#/components/schemas/RegisterWorkspaceRequest"
    WorkspaceProbe:
      type: object
      additionalProperties: false
      required: [state, path, candidates]
      properties:
        state:
          type: string
          enum: [ready_to_register, initialization_required]
        path:
          type: string
        candidates:
          type: array
          maxItems: 2000
          items:
            type: object
            additionalProperties: false
            required: [path, size]
            properties:
              path:
                type: string
              size:
                type: integer
                minimum: 0
                maximum: 262144
    WorkspaceAnalyzeRequest:
      type: object
      additionalProperties: false
      required: [path, script]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 32767
        script:
          type: string
          minLength: 1
          maxLength: 1024
    WorkspaceApplyRequest:
      type: object
      additionalProperties: false
      required: [candidateId]
      properties:
        candidateId:
          type: string
          minLength: 1
          maxLength: 64
    WorkspaceImportCorrectionRequest:
      type: object
      additionalProperties: false
      required: [candidateId, systemName, description, serviceDisplayNames, portPreferred, composeRunning, composeBuild]
      properties:
        candidateId:
          type: string
          minLength: 1
          maxLength: 64
        systemName:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1024
        serviceDisplayNames:
          type: object
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 128
        portPreferred:
          type: object
          additionalProperties:
            type: integer
            minimum: 1024
            maximum: 65535
        composeRunning:
          type: object
          additionalProperties:
            type: boolean
        composeBuild:
          type: boolean
    WorkspaceRelinkDraftRequest:
      $ref: "#/components/schemas/RegisterWorkspaceRequest"
    WorkspaceImportDraft:
      type: object
      additionalProperties: false
      required: [id, state, path, expiresAt, draft]
      properties:
        id:
          type: string
          pattern: "^draft_[0-9a-f]{32}$"
        state:
          type: string
          enum: [active, applied, expired]
        path:
          type: string
        expiresAt:
          type: string
          format: date-time
        draft:
          $ref: "#/components/schemas/WorkspaceImportDraftContent"
    WorkspaceImportDraftContent:
      type: object
      description: Bounded structured draft with relative evidence; never contains BAT source text or service environments.
      additionalProperties: false
      required: [systemId, systemName, analyzedAt, candidates]
      properties:
        systemId:
          $ref: "#/components/schemas/ManifestId"
        systemName:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1024
        sourceScript:
          type: string
          maxLength: 1024
        sourceDigest:
          $ref: "#/components/schemas/Digest"
        analyzedAt:
          type: string
          format: date-time
        candidates:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: "#/components/schemas/WorkspaceImportCandidate"
    WorkspaceImportCandidate:
      type: object
      additionalProperties: false
      required: [id, name, description, applyable, requiredCapabilities, services, ports, findings, manifestYaml, manifestDigest]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 1024
        applyable:
          type: boolean
        requiredCapabilities:
          type: array
          maxItems: 16
          items:
            type: string
        services:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/WorkspaceServiceDraft"
        ports:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/WorkspacePortDraft"
        findings:
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/WorkspaceImportFinding"
        manifestYaml:
          type: string
          maxLength: 1048576
        manifestDigest:
          $ref: "#/components/schemas/Digest"
    WorkspaceServiceDraft:
      type: object
      additionalProperties: false
      required: [id, displayName, driver, mode, readinessType, confidence]
      properties:
        id:
          $ref: "#/components/schemas/ManifestId"
        displayName:
          type: string
          maxLength: 128
        driver:
          type: string
          enum: [process, compose]
        runner:
          type: string
          enum: [maven, npm, java, node, go]
        mode:
          type: string
          enum: [daemon, oneshot]
        workingDirectory:
          type: string
          maxLength: 1024
        readinessType:
          type: string
        readinessTarget:
          type: string
        confidence:
          type: string
          enum: [confirmed, inferred, unresolved]
        compose:
          $ref: "#/components/schemas/WorkspaceComposeDraft"
    WorkspaceComposeDraft:
      type: object
      additionalProperties: false
      required: [file, services, buildPolicy, buildServices, readiness, ports]
      properties:
        file:
          type: string
          maxLength: 1024
        services:
          type: array
          maxItems: 64
          items:
            type: string
        buildPolicy:
          type: string
          enum: [never, always]
        buildServices:
          type: array
          maxItems: 64
          items:
            type: string
        readiness:
          type: object
          additionalProperties:
            type: string
            enum: [healthy, running]
        ports:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required: [service, target]
            properties:
              service:
                type: string
              target:
                type: integer
                minimum: 1
                maximum: 65535
    WorkspacePortDraft:
      type: object
      additionalProperties: false
      required: [name, preferred, exposure, confidence]
      properties:
        name:
          $ref: "#/components/schemas/ManifestId"
        preferred:
          type: integer
          minimum: 0
          maximum: 65535
        exposure:
          type: string
          enum: [loopback, all_interfaces]
        confidence:
          type: string
          enum: [confirmed, inferred, unresolved]
    WorkspaceImportFinding:
      type: object
      additionalProperties: false
      required: [code, severity, message, confidence, evidence]
      properties:
        code:
          type: string
        severity:
          type: string
          enum: [info, warning, blocking]
        message:
          type: string
          maxLength: 1024
        field:
          type: string
        confidence:
          type: string
          enum: [confirmed, inferred, unresolved]
        evidence:
          type: array
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [path]
            properties:
              path:
                type: string
                maxLength: 1024
              line:
                type: integer
                minimum: 1
              field:
                type: string
    WorkspaceImportOperation:
      type: object
      additionalProperties: false
      required: [id, type, state, createdAt, steps]
      properties:
        id:
          $ref: "#/components/schemas/OperationId"
        workspaceId:
          $ref: "#/components/schemas/WorkspaceId"
        type:
          type: string
          enum: [workspace-import-apply, workspace-edit-apply, workspace-relink-apply]
        state:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        errorCode:
          $ref: "#/components/schemas/ErrorCode"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          minimum: 0
        steps:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [number, key, state]
            properties:
              number:
                type: integer
                minimum: 1
              key:
                type: string
              state:
                type: string
                enum: [pending, running, succeeded, failed, skipped, cancelled]
              startedAt:
                type: string
                format: date-time
              finishedAt:
                type: string
                format: date-time
              errorCode:
                $ref: "#/components/schemas/ErrorCode"
    WorkspaceEditDraftRequest:
      type: object
      additionalProperties: false
      required: [systemName, description, serviceDisplayNames, portPreferred]
      properties:
        systemName:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1024
        serviceDisplayNames:
          type: object
          additionalProperties:
            type: string
            maxLength: 128
        portPreferred:
          type: object
          additionalProperties:
            type: integer
            minimum: 1024
            maximum: 65535
    WorkspaceDetail:
      type: object
      additionalProperties: false
      required: [workspace, source, manifest, services, ports, runtime]
      properties:
        workspace:
          $ref: "#/components/schemas/Workspace"
        source:
          type: object
          additionalProperties: false
          required: [type]
          properties:
            type:
              type: string
              enum: [existing-manifest, bat-import, structured-edit, relinked-manifest]
            entryScript:
              type: string
            sourceDigest:
              $ref: "#/components/schemas/Digest"
            analyzedAt:
              type: string
              format: date-time
        manifest:
          type: object
          additionalProperties: false
          required: [digest, apiVersion, yaml, createdAt]
          properties:
            digest:
              $ref: "#/components/schemas/Digest"
            apiVersion:
              type: string
            description:
              type: string
            yaml:
              type: string
              maxLength: 1048576
            createdAt:
              type: string
              format: date-time
        services:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceServiceDetail"
        ports:
          type: array
          items:
            $ref: "#/components/schemas/WorkspacePortDetail"
        runtime:
          type: object
          additionalProperties: false
          required: [state, activeOperationId]
          properties:
            state:
              type: string
              enum: [stopping, failed, starting, degraded, running, stopped]
            activeOperationId:
              oneOf:
                - $ref: "#/components/schemas/OperationId"
                - type: "null"
    WorkspaceServiceDetail:
      type: object
      additionalProperties: false
      required: [id, displayName, driver, mode, runner, workingDirectory, required, dependsOn, readiness]
      properties:
        id:
          $ref: "#/components/schemas/ManifestId"
        displayName:
          type: string
        driver:
          type: string
          enum: [process, compose]
        mode:
          type: string
          enum: [daemon, oneshot]
        runner:
          type: string
        workingDirectory:
          type: string
        required:
          type: boolean
        dependsOn:
          type: object
          additionalProperties:
            type: string
        readiness:
          type: string
    WorkspacePortDetail:
      type: object
      additionalProperties: false
      required: [name, protocol, conflictPolicy, exposure]
      properties:
        name:
          $ref: "#/components/schemas/ManifestId"
        protocol:
          type: string
          enum: [tcp]
        preferred:
          type: integer
          minimum: 1024
          maximum: 65535
        fallbackRange:
          type: string
        conflictPolicy:
          type: string
        exposure:
          type: string
          enum: [loopback]
    ServiceSummary:
      type: object
      additionalProperties: false
      required: [ready, total]
      properties:
        ready:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 1
    SystemSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - workspaceId
        - workspacePath
        - manifestStatus
        - manifestDigest
        - state
        - serviceSummary
        - activeOperationId
        - updatedAt
      properties:
        id:
          $ref: "#/components/schemas/ManifestId"
        name:
          type: string
        workspaceId:
          $ref: "#/components/schemas/WorkspaceId"
        workspacePath:
          type: string
        manifestStatus:
          type: string
          enum: [valid, invalid]
        manifestDigest:
          $ref: "#/components/schemas/Digest"
        state:
          type: string
          const: stopped
        serviceSummary:
          $ref: "#/components/schemas/ServiceSummary"
        activeOperationId:
          type: [string, "null"]
        updatedAt:
          type: string
          format: date-time
    SystemList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SystemSummary"
    ManifestSummary:
      type: object
      additionalProperties: false
      required: [digest, apiVersion, createdAt]
      properties:
        digest:
          $ref: "#/components/schemas/Digest"
        apiVersion:
          type: string
          const: stackpilot.io/v1alpha1
        createdAt:
          type: string
          format: date-time
    ServiceDefinition:
      type: object
      additionalProperties: false
      required: [id, driver, mode, required, definitionDigest]
      properties:
        id:
          $ref: "#/components/schemas/ManifestId"
        driver:
          type: string
          enum: [process, compose]
        mode:
          type: string
          enum: [daemon, oneshot]
        required:
          type: boolean
        definitionDigest:
          $ref: "#/components/schemas/Digest"
    SystemDetail:
      type: object
      additionalProperties: false
      required: [system, manifest, services]
      properties:
        system:
          $ref: "#/components/schemas/SystemSummary"
        manifest:
          $ref: "#/components/schemas/ManifestSummary"
        services:
          type: array
          items:
            $ref: "#/components/schemas/ServiceDefinition"
  responses:
    Unauthorized:
      description: Local token or browser session authentication failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Browser origin or CSRF validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: Authentication capacity is temporarily exhausted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    HealthNotReady:
      description: Persistence or initial reconciliation is not ready.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: HEALTH_NOT_READY
              message: The control plane is not ready.
              details: {}
              traceId: tr_0123456789abcdef0123456789abcdef
    BadRequest:
      description: The request or manifest syntax is invalid.
      content:
        application/json:
          schema:
