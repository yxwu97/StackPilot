        - COMPOSE_PROJECT_IDENTITY_MISMATCH
        - COMPOSE_PROJECT_NOT_FOUND
        - COMPOSE_START_FAILED
        - COMPOSE_STOP_FAILED
        - CONTAINER_UNHEALTHY
        - COMPOSE_VERSION_UNSUPPORTED
        - CHANGE_PLAN_BLOCKED
        - CHANGE_PLAN_INVALID_STATE
        - CHANGE_PLAN_NOT_FOUND
        - CHANGE_PLAN_STALE
        - DOCKER_DAEMON_UNAVAILABLE
        - DOCKER_NOT_FOUND
