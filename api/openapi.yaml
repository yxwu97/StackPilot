        - MANIFEST_CYCLE_DETECTED
        - MANIFEST_DURATION_INVALID
        - MANIFEST_FILE_TOO_LARGE
        - MANIFEST_HEALTH_TARGET_UNSAFE
        - MANIFEST_CHANGED
        - MANIFEST_MULTIPLE_DOCUMENTS
        - MANIFEST_NOT_REGULAR_FILE
        - MANIFEST_PATH_OUTSIDE_WORKSPACE
        - MANIFEST_PORT_RANGE_INVALID
        - MANIFEST_REFERENCE_NOT_FOUND
        - MANIFEST_SCHEMA_INVALID
        - MANIFEST_SEMANTIC_INVALID
        - MANIFEST_TEMPLATE_INVALID
        - MANIFEST_UNKNOWN_FIELD
        - MANIFEST_YAML_INVALID
