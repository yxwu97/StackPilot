name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish Windows release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Web dependencies
        run: npm ci
      - name: Verify product version and release tag
        shell: pwsh
        run: |
          $version = ./scripts/version.ps1 -Action Show
          ./scripts/version.ps1 -Action Check -ExpectedTag $env:GITHUB_REF_NAME
          "STACKPILOT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify release candidate
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Publish GoReleaser artifacts
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.12.7
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STACKPILOT_VERSION: ${{ env.STACKPILOT_VERSION }}
